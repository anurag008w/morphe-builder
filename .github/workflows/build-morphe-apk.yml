name: Build Morphe Patched APK

on:
  workflow_dispatch:
    inputs:
      app_type:
        description: '1. Kaunsa app patch karna hai?'
        required: true
        default: 'YouTube'
        type: choice
        options:
          - 'YouTube'
          - 'YouTube-Music'
          - 'Reddit'

      patch_selection_source:
        description: '2. Patches Kahan Se Lene Hain?'
        required: true
        default: 'Use Config Files (config/*-patches.txt)'
        type: choice
        options:
          - 'Use Config Files (config/*-patches.txt)'
          - 'Morphe Default Recommended (Sabhi Default)'

      install_type:
        description: '3. Install Type (Non-Root vs Root)'
        required: true
        default: 'Non-Root (with GmsCore)'
        type: choice
        options:
          - 'Non-Root (with GmsCore)'
          - 'Root (without GmsCore)'

      architecture:
        description: '4. Architecture (arm64-v8a se APK chhota aur fast banta hai)'
        required: true
        default: 'arm64-v8a'
        type: choice
        options:
          - 'arm64-v8a'
          - 'armeabi-v7a'
          - 'all'

      patch_channel:
        description: '5. Patch Channel'
        required: true
        default: 'Stable'
        type: choice
        options:
          - 'Stable'
          - 'Pre-release (Dev)'

      custom_apk_url:
        description: '6. Custom APK URL (Khaali chhodoge toh default use hoga)'
        required: false
        default: ''
        type: string

# ------------------------------------------------------------------
# 🔗 DEFAULT APK DOWNLOAD LINKS
# ------------------------------------------------------------------
env:
  DEFAULT_YOUTUBE_URL: "https://www.apkmirror.com/apk/google-inc/youtube/youtube-21-04-223-release/youtube-21-04-223-android-apk-download/download/?key=b87ce717c47f3920c139dae8e15df2ba744764e9&forcebaseapk=true"
  DEFAULT_YTMUSIC_URL: "https://www.apkmirror.com/apk/google-inc/youtube-music/youtube-music-9-15-51-release/youtube-music-9-15-51-4-android-apk-download/download/?key=fed902f297975b9851e611188d3a3764d9217718&forcebaseapk=true"
  DEFAULT_REDDIT_URL: "https://www.apkmirror.com/apk/redditinc/reddit/reddit-2025-08-0-release/reddit-2025-08-0-android-apk-download/download/"

permissions:
  contents: write

jobs:
  build-morphe-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Setup Android Build Tools & SDK
        uses: android-actions/setup-android@v3

      - name: Resolve APK Download URL
        id: resolve-url
        run: |
          INPUT_URL="${{ github.event.inputs.custom_apk_url }}"
          
          if [ -n "$INPUT_URL" ]; then
            SELECTED_URL="$INPUT_URL"
            echo "Using custom URL provided in input."
          else
            if [ "${{ github.event.inputs.app_type }}" = "YouTube" ]; then
              SELECTED_URL="${{ env.DEFAULT_YOUTUBE_URL }}"
            elif [ "${{ github.event.inputs.app_type }}" = "YouTube-Music" ]; then
              SELECTED_URL="${{ env.DEFAULT_YTMUSIC_URL }}"
            else
              SELECTED_URL="${{ env.DEFAULT_REDDIT_URL }}"
            fi
            echo "Using default configured URL."
          fi

          echo "final_url=$SELECTED_URL" >> $GITHUB_OUTPUT

      - name: Smart APK Downloader
        run: |
          python3 - << 'EOF'
          import urllib.request, re, sys, os

          url = "${{ steps.resolve-url.outputs.final_url }}".strip()
          print(f"Resolving & Downloading APK from: {url}")

          user_agent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"
          headers = {
              "User-Agent": user_agent,
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8",
              "Accept-Language": "en-US,en;q=0.5",
              "Referer": url
          }

          req = urllib.request.Request(url, headers=headers)
          with urllib.request.urlopen(req) as resp:
              content_type = resp.headers.get("Content-Type", "").lower()
              
              if "application/vnd.android.package-archive" in content_type or "application/zip" in content_type or "octet-stream" in content_type:
                  print("Direct APK stream detected. Downloading directly...")
                  with open("input.apk", "wb") as f:
                      f.write(resp.read())
              else:
                  html = resp.read().decode("utf-8", errors="ignore")
                  matches = re.findall(r"href=[\"']([^\"']*download\.php[^\"']*)[\"']", html)
                  
                  if not matches:
                      matches = re.findall(r"href=[\"']([^\"']*(?:download|downloading)[^\"']*)[\"']", html)
                      
                  if not matches:
                      print("❌ Could not parse APK link from webpage. Please provide a direct download link.")
                      sys.exit(1)
                      
                  sub_link = matches[0]
                  if sub_link.startswith("/"):
                      direct_url = "https://www.apkmirror.com" + sub_link
                  elif not sub_link.startswith("http"):
                      direct_url = "https://www.apkmirror.com/" + sub_link
                  else:
                      direct_url = sub_link
                      
                  print(f"Extracted direct download endpoint: {direct_url}")
                  sub_req = urllib.request.Request(direct_url, headers=headers)
                  with urllib.request.urlopen(sub_req) as sub_resp, open("input.apk", "wb") as out_f:
                      size = sub_resp.headers.get("Content-Length", "Unknown")
                      print(f"Streaming APK file (Size: {size} bytes)...")
                      while True:
                          chunk = sub_resp.read(2 * 1024 * 1024)
                          if not chunk:
                              break
                          out_f.write(chunk)
                          print(".", end="", flush=True)
                      print("\nDownload complete!")

          if os.path.exists("input.apk") and os.path.getsize("input.apk") > 1000000:
              print(f"✅ Download Verified. File Size: {os.path.getsize('input.apk') / (1024*1024):.2f} MB")
          else:
              print("❌ Downloaded file is too small or invalid APK.")
              sys.exit(1)
          EOF

      - name: Clone & Download Official Morphe Tools
        run: |
          python3 - << 'EOF'
          import urllib.request, json, os, sys

          os.makedirs("build-tools", exist_ok=True)
          headers = {"User-Agent": "Mozilla/5.0"}
          is_prerelease = "${{ github.event.inputs.patch_channel }}" == "Pre-release (Dev)"

          # 1. Fetch Morphe Desktop CLI
          print("Fetching latest Morphe Desktop CLI...")
          req_cli = urllib.request.Request("https://api.github.com/repos/MorpheApp/morphe-desktop/releases/latest", headers=headers)
          cli_data = json.loads(urllib.request.urlopen(req_cli).read().decode())
          cli_url = None
          for a in cli_data.get("assets", []):
              if a["name"].endswith(".jar"):
                  cli_url = a["browser_download_url"]
                  break
          if not cli_url:
              print("Error: Could not find Morphe CLI jar asset.")
              sys.exit(1)
          print(f"Downloading CLI from {cli_url}...")
          urllib.request.urlretrieve(cli_url, "build-tools/morphe-desktop.jar")

          # 2. Fetch Morphe Patches (.mpp)
          print(f"Fetching Morphe Patches (Channel: {'Pre-release' if is_prerelease else 'Stable'})...")
          patches_api_url = "https://api.github.com/repos/MorpheApp/morphe-patches/releases" if is_prerelease else "https://api.github.com/repos/MorpheApp/morphe-patches/releases/latest"
          req_patches = urllib.request.Request(patches_api_url, headers=headers)
          
          if is_prerelease:
              releases = json.loads(urllib.request.urlopen(req_patches).read().decode())
              patches_data = releases[0] if releases else {}
          else:
              patches_data = json.loads(urllib.request.urlopen(req_patches).read().decode())

          mpp_url = None
          for a in patches_data.get("assets", []):
              if a["name"].endswith(".mpp"):
                  mpp_url = a["browser_download_url"]
                  break
          if not mpp_url:
              print("Error: Could not find Morphe .mpp patch asset.")
              sys.exit(1)
          print(f"Downloading Patches from {mpp_url}...")
          urllib.request.urlretrieve(mpp_url, "build-tools/patches.mpp")

          print("✅ Official Morphe tools downloaded successfully!")
          EOF

          ls -lh build-tools/

      - name: Patch APK with Configured Patches
        run: |
          python3 - << 'EOF'
          import subprocess, os, sys

          app_type = "${{ github.event.inputs.app_type }}"
          selection_source = "${{ github.event.inputs.patch_selection_source }}"
          install_type = "${{ github.event.inputs.install_type }}"
          arch = "${{ github.event.inputs.architecture }}"

          cfg_map = {
              "YouTube": "config/youtube-patches.txt",
              "YouTube-Music": "config/ytmusic-patches.txt",
              "Reddit": "config/reddit-patches.txt"
          }

          args = ["java", "-jar", "build-tools/morphe-desktop.jar", "patch"]
          args.extend(["-p", "build-tools/patches.mpp"])
          args.extend(["-o", f"Morphe-{app_type}.apk"])

          # Architecture stripping
          if arch != "all":
              args.append(f"--striplibs={arch}")
              print(f"Applying ABI optimization: {arch}")

          # Read patches from config file if selected
          if "Use Config Files" in selection_source:
              cfg_file = cfg_map.get(app_type)
              if os.path.exists(cfg_file):
                  print(f"Reading patch selections from: {cfg_file}")
                  with open(cfg_file, "r") as f:
                      for line in f:
                          line = line.strip()
                          if not line or line.startswith("# =") or line.startswith("# [") or line.startswith("# -") or line.startswith("# Morphe") or line.startswith("# Instructions"):
                              continue
                          if line.startswith("#"):
                              p_name = line.lstrip("#").strip()
                              if p_name:
                                  args.extend(["-d", p_name])
                          else:
                              args.extend(["-e", line])
              else:
                  print(f"Warning: {cfg_file} not found, using defaults.")

          # Root vs Non-Root
          if install_type == "Root (without GmsCore)":
              args.extend(["-d", "GmsCore support"])
              print("Root mode: GmsCore support disabled")

          args.append("input.apk")
          print("Running command:", " ".join(args))
          
          res = subprocess.run(args)
          if res.returncode != 0:
              sys.exit(res.returncode)
          EOF

          echo "Patched & Signed APK ready:"
          ls -lh Morphe-*.apk

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Morphe-${{ github.event.inputs.app_type }}-${{ github.event.inputs.architecture }}
          path: Morphe-${{ github.event.inputs.app_type }}.apk
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: ${{ github.event.inputs.app_type }}-v${{ github.run_number }}
          name: "Morphe ${{ github.event.inputs.app_type }} (${{ github.event.inputs.architecture }})"
          body: |
            ### 💊 Morphe ${{ github.event.inputs.app_type }} Built Successfully!
            - **Target App:** ${{ github.event.inputs.app_type }}
            - **Architecture:** ${{ github.event.inputs.architecture }}
            - **Install Type:** ${{ github.event.inputs.install_type }}
            - **Channel:** ${{ github.event.inputs.patch_channel }}
            - **Built on:** ${{ github.event.repository.updated_at }}
          files: Morphe-${{ github.event.inputs.app_type }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
