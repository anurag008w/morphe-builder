name: Build Morphe Patched APK

on:
  workflow_dispatch:
    inputs:
      app_type:
        description: '📱 1. Kaunsa app patch karna hai?'
        required: true
        default: 'All (YouTube + YouTube-Music)'
        type: choice
        options:
          - 'All (YouTube + YouTube-Music)'
          - 'YouTube'
          - 'YouTube-Music'
          - 'Reddit'

      install_type:
        description: '🔑 2. Install Type (Non-Root vs Root)'
        required: true
        default: 'Non-Root (with GmsCore)'
        type: choice
        options:
          - 'Non-Root (with GmsCore)'
          - 'Root (without GmsCore)'

      # =========================================================
      # 🔴 YOUTUBE PATCHES (DIRECT CHECKBOXES)
      # =========================================================
      yt_hide_ads:
        description: '🔴 [YT] Block Video & Banner Ads'
        required: true
        default: true
        type: boolean

      yt_sponsorblock:
        description: '🔴 [YT] SponsorBlock (Skip Sponsored Segments)'
        required: true
        default: true
        type: boolean

      yt_return_dislike:
        description: '🔴 [YT] Return YouTube Dislike (Show Dislike Count)'
        required: true
        default: true
        type: boolean

      yt_background_play:
        description: '🔴 [YT] Background Playback (Screen Off / Pip)'
        required: true
        default: true
        type: boolean

      yt_downloads:
        description: '🔴 [YT] Downloads Button (External Downloader Support)'
        required: true
        default: true
        type: boolean

      yt_swipe_controls:
        description: '🔴 [YT] Swipe Controls (Volume & Brightness Gestures)'
        required: true
        default: true
        type: boolean

      yt_seekbar:
        description: '🔴 [YT] Seekbar Customizations (Old Seekbar & Tap to Seek)'
        required: true
        default: true
        type: boolean

      yt_hide_shorts:
        description: '🔴 [YT] Hide Shorts Tab & Shelf (Shorts band karna)'
        required: true
        default: false
        type: boolean

      yt_custom_branding:
        description: '🔴 [YT] Custom Branding (Morphe App Icon & Name)'
        required: true
        default: true
        type: boolean

      # =========================================================
      # 🎵 YOUTUBE MUSIC PATCHES (DIRECT CHECKBOXES)
      # =========================================================
      ytm_hide_ads:
        description: '🎵 [YT Music] Block Ads & Premium Promotions'
        required: true
        default: true
        type: boolean

      ytm_crossfade:
        description: '🎵 [YT Music] Dual-Player Crossfade (Smooth Transition)'
        required: true
        default: true
        type: boolean

      ytm_lyrics:
        description: '🎵 [YT Music] Third-party Synced Lyrics (LRCLIB)'
        required: true
        default: true
        type: boolean

      ytm_background_play:
        description: '🎵 [YT Music] Background Audio Playback'
        required: true
        default: true
        type: boolean

      ytm_sponsorblock:
        description: '🎵 [YT Music] SponsorBlock (Skip Non-Music Segments)'
        required: true
        default: true
        type: boolean

      ytm_return_dislike:
        description: '🎵 [YT Music] Return YouTube Dislike'
        required: true
        default: true
        type: boolean

      ytm_downloads:
        description: '🎵 [YT Music] In-App Music Downloader Button'
        required: true
        default: true
        type: boolean

      ytm_remember_state:
        description: '🎵 [YT Music] Remember Shuffle & Repeat State'
        required: true
        default: true
        type: boolean

      ytm_custom_branding:
        description: '🎵 [YT Music] Custom Branding (Icon & Name)'
        required: true
        default: true
        type: boolean

      # =========================================================
      # ⚙️ ADVANCED SETTINGS
      # =========================================================
      architecture:
        description: '⚡ Architecture (arm64-v8a se APK chhota banta hai)'
        required: true
        default: 'arm64-v8a'
        type: choice
        options:
          - 'arm64-v8a'
          - 'armeabi-v7a'
          - 'all'

      include_microg:
        description: '📦 Release me latest MicroG (GmsCore) APK include karein?'
        required: true
        default: true
        type: boolean

      custom_exclude_patches:
        description: '🚫 Koi aur patch band karna hai? (Comma-separated)'
        required: false
        default: ''
        type: string

      custom_include_patches:
        description: '➕ Koi aur patch chalu karna hai? (Comma-separated)'
        required: false
        default: ''
        type: string

      custom_apk_url:
        description: '🔗 Custom APK URL (Khaali chhodoge toh default use hoga)'
        required: false
        default: ''
        type: string

# ------------------------------------------------------------------
# 🔗 DEFAULT APK DOWNLOAD LINKS
# ------------------------------------------------------------------
env:
  DEFAULT_YOUTUBE_URL: "https://www.apkmirror.com/apk/google-inc/youtube/youtube-21-04-223-release/youtube-21-04-223-android-apk-download/download/?key=b87ce717c47f3920c139dae8e15df2ba744764e9&forcebaseapk=true"
  DEFAULT_YTMUSIC_URL: "https://www.apkmirror.com/apk/google-inc/youtube-music/youtube-music-9-15-51-release/youtube-music-9-15-51-4-android-apk-download/download/?key=fed902f297975b9851e611188d3a3764d9217718&forcebaseapk=true"
  DEFAULT_REDDIT_URL: "https://www.apkmirror.com/apk/redditinc/reddit/reddit-2025-08-0-release/reddit-2025-08-0-android-apk-download/download/"

permissions:
  contents: write

jobs:
  build-morphe-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Setup Android Build Tools & SDK
        uses: android-actions/setup-android@v3

      - name: Clone & Download Official Morphe Tools
        run: |
          python3 - << 'EOF'
          import urllib.request, json, os, sys

          os.makedirs("build-tools", exist_ok=True)
          os.makedirs("output", exist_ok=True)
          headers = {"User-Agent": "Mozilla/5.0"}

          # 1. Fetch Morphe Desktop CLI
          print("Fetching latest Morphe Desktop CLI...")
          req_cli = urllib.request.Request("https://api.github.com/repos/MorpheApp/morphe-desktop/releases/latest", headers=headers)
          cli_data = json.loads(urllib.request.urlopen(req_cli).read().decode())
          cli_url = None
          for a in cli_data.get("assets", []):
              if a["name"].endswith(".jar"):
                  cli_url = a["browser_download_url"]
                  break
          if not cli_url:
              print("Error: Could not find Morphe CLI jar asset.")
              sys.exit(1)
          print(f"Downloading CLI from {cli_url}...")
          urllib.request.urlretrieve(cli_url, "build-tools/morphe-desktop.jar")

          # 2. Fetch Morphe Patches (.mpp)
          print("Fetching latest Morphe Patches bundle...")
          req_patches = urllib.request.Request("https://api.github.com/repos/MorpheApp/morphe-patches/releases/latest", headers=headers)
          patches_data = json.loads(urllib.request.urlopen(req_patches).read().decode())
          mpp_url = None
          for a in patches_data.get("assets", []):
              if a["name"].endswith(".mpp"):
                  mpp_url = a["browser_download_url"]
                  break
          if not mpp_url:
              print("Error: Could not find Morphe .mpp patch asset.")
              sys.exit(1)
          print(f"Downloading Patches from {mpp_url}...")
          urllib.request.urlretrieve(mpp_url, "build-tools/patches.mpp")

          # 3. Fetch Latest MicroG (GmsCore)
          if "${{ github.event.inputs.include_microg }}" == "true":
              try:
                  print("Fetching latest MicroG GmsCore...")
                  req_microg = urllib.request.Request("https://api.github.com/repos/MorpheApp/MicroG-RE/releases/latest", headers=headers)
                  microg_data = json.loads(urllib.request.urlopen(req_microg).read().decode())
                  for a in microg_data.get("assets", []):
                      if a["name"].endswith(".apk"):
                          print(f"Downloading MicroG from {a['browser_download_url']}...")
                          urllib.request.urlretrieve(a["browser_download_url"], f"output/{a['name']}")
                          break
              except Exception as e:
                  print(f"MicroG download notice: {e}")

          print("✅ Official Morphe tools ready!")
          EOF

      - name: Process, Patch and Sign Target APK(s)
        run: |
          python3 - << 'EOF'
          import urllib.request, re, sys, os, subprocess

          app_choice = "${{ github.event.inputs.app_type }}"
          custom_url = "${{ github.event.inputs.custom_apk_url }}".strip()
          install_type = "${{ github.event.inputs.install_type }}"
          arch = "${{ github.event.inputs.architecture }}"

          # YouTube Checkboxes
          yt_ads = "${{ github.event.inputs.yt_hide_ads }}" == "true"
          yt_sponsor = "${{ github.event.inputs.yt_sponsorblock }}" == "true"
          yt_dislike = "${{ github.event.inputs.yt_return_dislike }}" == "true"
          yt_bg = "${{ github.event.inputs.yt_background_play }}" == "true"
          yt_dl = "${{ github.event.inputs.yt_downloads }}" == "true"
          yt_swipe = "${{ github.event.inputs.yt_swipe_controls }}" == "true"
          yt_seekbar = "${{ github.event.inputs.yt_seekbar }}" == "true"
          yt_shorts = "${{ github.event.inputs.yt_hide_shorts }}" == "true"
          yt_branding = "${{ github.event.inputs.yt_custom_branding }}" == "true"

          # YT Music Checkboxes
          ytm_ads = "${{ github.event.inputs.ytm_hide_ads }}" == "true"
          ytm_crossfade = "${{ github.event.inputs.ytm_crossfade }}" == "true"
          ytm_lyrics = "${{ github.event.inputs.ytm_lyrics }}" == "true"
          ytm_bg = "${{ github.event.inputs.ytm_background_play }}" == "true"
          ytm_sponsor = "${{ github.event.inputs.ytm_sponsorblock }}" == "true"
          ytm_dislike = "${{ github.event.inputs.ytm_return_dislike }}" == "true"
          ytm_dl = "${{ github.event.inputs.ytm_downloads }}" == "true"
          ytm_remember = "${{ github.event.inputs.ytm_remember_state }}" == "true"
          ytm_branding = "${{ github.event.inputs.ytm_custom_branding }}" == "true"

          custom_exclude = "${{ github.event.inputs.custom_exclude_patches }}".strip()
          custom_include = "${{ github.event.inputs.custom_include_patches }}".strip()

          targets = []
          if app_choice == "All (YouTube + YouTube-Music)":
              targets = ["YouTube", "YouTube-Music"]
          else:
              targets = [app_choice]

          default_urls = {
              "YouTube": "${{ env.DEFAULT_YOUTUBE_URL }}",
              "YouTube-Music": "${{ env.DEFAULT_YTMUSIC_URL }}",
              "Reddit": "${{ env.DEFAULT_REDDIT_URL }}"
          }

          cfg_map = {
              "YouTube": "config/youtube-patches.txt",
              "YouTube-Music": "config/ytmusic-patches.txt",
              "Reddit": "config/reddit-patches.txt"
          }

          user_agent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"
          headers = {
              "User-Agent": user_agent,
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8",
              "Accept-Language": "en-US,en;q=0.5"
          }

          def download_apk(url, dest_file):
              print(f"Downloading from URL: {url}")
              headers_with_ref = dict(headers)
              headers_with_ref["Referer"] = url
              req = urllib.request.Request(url, headers=headers_with_ref)
              with urllib.request.urlopen(req) as resp:
                  content_type = resp.headers.get("Content-Type", "").lower()
                  if "application/vnd.android.package-archive" in content_type or "application/zip" in content_type or "octet-stream" in content_type:
                      with open(dest_file, "wb") as f:
                          f.write(resp.read())
                  else:
                      html = resp.read().decode("utf-8", errors="ignore")
                      matches = re.findall(r"href=[\"']([^\"']*download\.php[^\"']*)[\"']", html)
                      if not matches:
                          matches = re.findall(r"href=[\"']([^\"']*(?:download|downloading)[^\"']*)[\"']", html)
                      if not matches:
                          raise Exception(f"Failed to parse direct link from webpage: {url}")
                      
                      sub_link = matches[0]
                      direct_url = "https://www.apkmirror.com" + sub_link if sub_link.startswith("/") else sub_link
                      sub_req = urllib.request.Request(direct_url, headers=headers_with_ref)
                      with urllib.request.urlopen(sub_req) as sub_resp, open(dest_file, "wb") as out_f:
                          while True:
                              chunk = sub_resp.read(2 * 1024 * 1024)
                              if not chunk:
                                  break
                              out_f.write(chunk)

          for app in targets:
              print(f"\n=======================================================")
              print(f"  PROCESSING TARGET: {app}")
              print(f"=======================================================")
              
              apk_url = custom_url if (custom_url and len(targets) == 1) else default_urls.get(app)
              input_apk = f"input-{app}.apk"
              output_apk = f"output/Morphe-{app}.apk"

              download_apk(apk_url, input_apk)
              print(f"✅ {app} stock APK downloaded: {os.path.getsize(input_apk) / (1024*1024):.2f} MB")

              args = ["java", "-jar", "build-tools/morphe-desktop.jar", "patch"]
              args.extend(["-p", "build-tools/patches.mpp"])
              args.extend(["-o", output_apk])

              if arch != "all":
                  args.append(f"--striplibs={arch}")

              # 1. READ ALL PATCHES FROM CONFIG FILE FIRST
              cfg_file = cfg_map.get(app)
              disabled_patches = set()
              enabled_patches = set()

              if os.path.exists(cfg_file):
                  print(f"Loading full patch list from: {cfg_file}")
                  with open(cfg_file, "r") as f:
                      for line in f:
                          line = line.strip()
                          if not line or line.startswith("# =") or line.startswith("# [") or line.startswith("# -") or line.startswith("# Morphe") or line.startswith("# Instructions"):
                              continue
                          if line.startswith("#"):
                              p_name = line.lstrip("#").strip()
                              if p_name: disabled_patches.add(p_name)
                          else:
                              enabled_patches.add(line)
                  print(f"[{app}] Loaded from file: {len(enabled_patches)} Enabled, {len(disabled_patches)} Disabled")

              # 2. OVERRIDE WITH RUN WORKFLOW CHECKBOXES
              if app == "YouTube":
                  if not yt_ads: disabled_patches.add("Hide ads"); enabled_patches.discard("Hide ads")
                  if not yt_sponsor: disabled_patches.add("SponsorBlock"); enabled_patches.discard("SponsorBlock")
                  if not yt_dislike: disabled_patches.add("Return YouTube Dislike"); enabled_patches.discard("Return YouTube Dislike")
                  if not yt_bg: disabled_patches.add("Remove background playback restrictions"); enabled_patches.discard("Remove background playback restrictions")
                  if not yt_dl: disabled_patches.add("Downloads"); enabled_patches.discard("Downloads")
                  if not yt_swipe: disabled_patches.add("Swipe controls"); enabled_patches.discard("Swipe controls")
                  if not yt_seekbar: disabled_patches.add("Seekbar"); enabled_patches.discard("Seekbar")
                  if not yt_branding: disabled_patches.add("Custom branding"); enabled_patches.discard("Custom branding")
                  if yt_shorts: enabled_patches.add("Hide Shorts components"); disabled_patches.discard("Hide Shorts components")

              elif app == "YouTube-Music":
                  if not ytm_ads: disabled_patches.add("Hide ads"); enabled_patches.discard("Hide ads")
                  if not ytm_crossfade: disabled_patches.add("Crossfade"); enabled_patches.discard("Crossfade")
                  if not ytm_lyrics: disabled_patches.add("Third-party lyrics"); enabled_patches.discard("Third-party lyrics")
                  if not ytm_bg: disabled_patches.add("Remove background playback restrictions"); enabled_patches.discard("Remove background playback restrictions")
                  if not ytm_sponsor: disabled_patches.add("SponsorBlock"); enabled_patches.discard("SponsorBlock")
                  if not ytm_dislike: disabled_patches.add("Return YouTube Dislike"); enabled_patches.discard("Return YouTube Dislike")
                  if not ytm_dl: disabled_patches.add("Downloads"); enabled_patches.discard("Downloads")
                  if not ytm_remember:
                      disabled_patches.add("Remember repeat state")
                      disabled_patches.add("Remember shuffle state")
                      enabled_patches.discard("Remember repeat state")
                      enabled_patches.discard("Remember shuffle state")
                  if not ytm_branding: disabled_patches.add("Custom branding"); enabled_patches.discard("Custom branding")

              # Root mode
              if install_type == "Root (without GmsCore)":
                  disabled_patches.add("GmsCore support")
                  enabled_patches.discard("GmsCore support")

              # Custom inputs
              if custom_exclude:
                  for p in custom_exclude.split(","):
                      p = p.strip()
                      if p:
                          disabled_patches.add(p)
                          enabled_patches.discard(p)

              if custom_include:
                  for p in custom_include.split(","):
                      p = p.strip()
                      if p:
                          enabled_patches.add(p)
                          disabled_patches.discard(p)

              for d in disabled_patches:
                  args.extend(["-d", d])

              for e in enabled_patches:
                  args.extend(["-e", e])

              args.append(input_apk)
              print(f"Applying {len(enabled_patches)} enabled patches (and {len(disabled_patches)} disabled) for {app}...")
              res = subprocess.run(args)
              if res.returncode != 0:
                  print(f"❌ Patching failed for {app}")
                  sys.exit(res.returncode)
              print(f"✅ {app} successfully patched!")

          # Generate SHA256 Checksums
          with open("output/sha256sum.txt", "w") as chk_file:
              for f_name in os.listdir("output"):
                  if f_name.endswith(".apk"):
                      import hashlib
                      with open(os.path.join("output", f_name), "rb") as af:
                          h = hashlib.sha256(af.read()).hexdigest()
                          chk_file.write(f"{h}  {f_name}\n")
          EOF

          echo "Generated Files in output directory:"
          ls -lh output/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Morphe-Build-Output
          path: output/
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: build-v${{ github.run_number }}
          name: "Morphe Apps Build #${{ github.run_number }}"
          body: |
            ### 💊 Morphe Patched Apps Release
            - **Target:** ${{ github.event.inputs.app_type }}
            - **Architecture:** ${{ github.event.inputs.architecture }}
            - **Install Type:** ${{ github.event.inputs.install_type }}
            - **Built on:** ${{ github.event.repository.updated_at }}

            #### 📦 Included Downloads:
            - Patched APKs are listed in Assets below.
            - GmsCore (MicroG) included for non-root Google account login.
            - `sha256sum.txt` included for file integrity verification.
          files: output/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
