name: Build Morphe Patched APK

on:
  workflow_dispatch:
    inputs:
      app_type:
        description: 'Kaunsa app patch karna hai?'
        required: true
        default: 'YouTube'
        type: choice
        options:
          - 'YouTube'
          - 'YouTube-Music'
      custom_apk_url:
        description: 'Optional: Custom APK URL (Khaali chhodoge toh workflow wala default URL use hoga)'
        required: false
        default: ''
        type: string

# ------------------------------------------------------------------
# 🔗 YAHAN APNE DEFAULT APK LINKS DAAL SAKTE HAIN:
# (Direct download links like APKMirror/personal cloud/etc.)
# ------------------------------------------------------------------
env:
  DEFAULT_YOUTUBE_URL: "https://example.com/path-to-your/youtube.apk"
  DEFAULT_YTMUSIC_URL: "https://example.com/path-to-your/ytmusic.apk"

permissions:
  contents: write

jobs:
  build-morphe-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android Build Tools & SDK
        uses: android-actions/setup-android@v3

      - name: Resolve APK Download URL
        id: resolve-url
        run: |
          INPUT_URL="${{ github.event.inputs.custom_apk_url }}"
          
          if [ -n "$INPUT_URL" ]; then
            SELECTED_URL="$INPUT_URL"
            echo "Using custom URL provided in input."
          else
            if [ "${{ github.event.inputs.app_type }}" = "YouTube" ]; then
              SELECTED_URL="${{ env.DEFAULT_YOUTUBE_URL }}"
            else
              SELECTED_URL="${{ env.DEFAULT_YTMUSIC_URL }}"
            fi
            echo "Using default URL configured in workflow."
          fi

          echo "final_url=$SELECTED_URL" >> $GITHUB_OUTPUT

      - name: Download Stock APK
        run: |
          APK_URL="${{ steps.resolve-url.outputs.final_url }}"
          echo "Downloading target APK from: $APK_URL"
          
          curl -sL "$APK_URL" -o input.apk

          if [ ! -s input.apk ]; then
            echo "❌ Error: APK download fail ho gaya ya link invalid hai! Please valid direct link use karein."
            exit 1
          fi
          
          echo "✅ APK successfully downloaded. Size:"
          ls -lh input.apk

      - name: Clone & Download Official Morphe Tools
        run: |
          mkdir -p build-tools
          cd build-tools

          echo "Fetching latest Morphe / ReVanced CLI..."
          CLI_URL=$(curl -s https://api.github.com/repos/ReVanced/revanced-cli/releases/latest | grep -o 'https://[^"]*revanced-cli-[0-9.]*-all.jar' | head -n 1)
          curl -sL "$CLI_URL" -o cli.jar

          echo "Fetching latest Morphe Patches & Integrations..."
          PATCHES_URL=$(curl -s https://api.github.com/repos/MorpheApp/morphe-patches/releases/latest | grep -o 'https://[^"]*morphe-patches-[0-9.]*.jar' | head -n 1 || curl -s https://api.github.com/repos/ReVanced/revanced-patches/releases/latest | grep -o 'https://[^"]*revanced-patches-[0-9.]*.jar' | head -n 1)
          INTEGRATIONS_URL=$(curl -s https://api.github.com/repos/MorpheApp/morphe-patches/releases/latest | grep -o 'https://[^"]*morphe-integrations-[0-9.]*.apk' | head -n 1 || curl -s https://api.github.com/repos/ReVanced/revanced-integrations/releases/latest | grep -o 'https://[^"]*revanced-integrations-[0-9.]*.apk' | head -n 1)

          curl -sL "$PATCHES_URL" -o patches.jar
          curl -sL "$INTEGRATIONS_URL" -o integrations.apk

          echo "Tools Ready:"
          ls -lh

      - name: Patch APK with Morphe Engine
        run: |
          echo "Starting patch process for ${{ github.event.inputs.app_type }}..."
          
          java -jar build-tools/cli.jar patch \
            --patches build-tools/patches.jar \
            --merge build-tools/integrations.apk \
            --out "Morphe-${{ github.event.inputs.app_type }}.apk" \
            input.apk

      - name: Sign APK (Zipalign & Apksigner)
        run: |
          echo "Signing Patched APK..."
          keytool -genkey -v -keystore release.keystore -alias morphe -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android -dname "CN=Morphe, OU=Morphe, O=Morphe, L=Unknown, ST=Unknown, C=US"

          zipalign -v -p 4 "Morphe-${{ github.event.inputs.app_type }}.apk" "Morphe-${{ github.event.inputs.app_type }}-aligned.apk" || mv "Morphe-${{ github.event.inputs.app_type }}.apk" "Morphe-${{ github.event.inputs.app_type }}-aligned.apk"
          
          apksigner sign --ks release.keystore --ks-pass pass:android --key-pass pass:android \
            --out "Morphe-${{ github.event.inputs.app_type }}-signed.apk" "Morphe-${{ github.event.inputs.app_type }}-aligned.apk"

          echo "Final signed APK ready:"
          ls -lh Morphe-*-signed.apk

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Morphe-${{ github.event.inputs.app_type }}
          path: Morphe-${{ github.event.inputs.app_type }}-signed.apk
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: ${{ github.event.inputs.app_type }}-v${{ github.run_number }}
          name: "Morphe ${{ github.event.inputs.app_type }} (Build #${{ github.run_number }})"
          body: |
            ### 💊 Morphe ${{ github.event.inputs.app_type }} Built Successfully!
            - **Target:** ${{ github.event.inputs.app_type }}
            - **Built on:** ${{ github.event.repository.updated_at }}
            - **GmsCore / MicroG:** Supported
          files: Morphe-${{ github.event.inputs.app_type }}-signed.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
