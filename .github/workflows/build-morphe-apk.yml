name: Build Morphe Patched APK

on:
  workflow_dispatch:
    inputs:
      app_type:
        description: 'Kaunsa app patch karna hai?'
        required: true
        default: 'YouTube'
        type: choice
        options:
          - 'YouTube'
          - 'YouTube-Music'
      custom_apk_url:
        description: 'Optional: Custom APK URL (Khaali chhodoge toh default URL use hoga)'
        required: false
        default: ''
        type: string

# ------------------------------------------------------------------
# 🔗 DEFAULT APK DOWNLOAD LINKS
# ------------------------------------------------------------------
env:
  DEFAULT_YOUTUBE_URL: "https://www.apkmirror.com/apk/google-inc/youtube/youtube-21-04-223-release/youtube-21-04-223-android-apk-download/download/?key=b87ce717c47f3920c139dae8e15df2ba744764e9&forcebaseapk=true"
  DEFAULT_YTMUSIC_URL: "https://www.apkmirror.com/apk/google-inc/youtube-music/youtube-music-8-12-52-release/youtube-music-8-12-52-android-apk-download/download/"

permissions:
  contents: write

jobs:
  build-morphe-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Setup Android Build Tools & SDK
        uses: android-actions/setup-android@v3

      - name: Resolve APK Download URL
        id: resolve-url
        run: |
          INPUT_URL="${{ github.event.inputs.custom_apk_url }}"
          
          if [ -n "$INPUT_URL" ]; then
            SELECTED_URL="$INPUT_URL"
            echo "Using custom URL provided in input."
          else
            if [ "${{ github.event.inputs.app_type }}" = "YouTube" ]; then
              SELECTED_URL="${{ env.DEFAULT_YOUTUBE_URL }}"
            else
              SELECTED_URL="${{ env.DEFAULT_YTMUSIC_URL }}"
            fi
            echo "Using default configured URL."
          fi

          echo "final_url=$SELECTED_URL" >> $GITHUB_OUTPUT

      - name: Smart APK Downloader
        run: |
          python3 - << 'EOF'
          import urllib.request, re, sys, os

          url = "${{ steps.resolve-url.outputs.final_url }}".strip()
          print(f"Resolving & Downloading APK from: {url}")

          user_agent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"
          headers = {
              "User-Agent": user_agent,
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8",
              "Accept-Language": "en-US,en;q=0.5",
              "Referer": url
          }

          req = urllib.request.Request(url, headers=headers)
          with urllib.request.urlopen(req) as resp:
              content_type = resp.headers.get("Content-Type", "").lower()
              
              if "application/vnd.android.package-archive" in content_type or "application/zip" in content_type or "octet-stream" in content_type:
                  print("Direct APK stream detected. Downloading directly...")
                  with open("input.apk", "wb") as f:
                      f.write(resp.read())
              else:
                  html = resp.read().decode("utf-8", errors="ignore")
                  matches = re.findall(r"href=[\"']([^\"']*download\.php[^\"']*)[\"']", html)
                  
                  if not matches:
                      # If no direct download.php, try checking any button/link with forcebaseapk or download
                      matches = re.findall(r"href=[\"']([^\"']*(?:download|downloading)[^\"']*)[\"']", html)
                      
                  if not matches:
                      print("❌ Could not parse APK link from webpage. Please provide a direct download link.")
                      sys.exit(1)
                      
                  sub_link = matches[0]
                  if sub_link.startswith("/"):
                      direct_url = "https://www.apkmirror.com" + sub_link
                  elif not sub_link.startswith("http"):
                      direct_url = "https://www.apkmirror.com/" + sub_link
                  else:
                      direct_url = sub_link
                      
                  print(f"Extracted direct download endpoint: {direct_url}")
                  sub_req = urllib.request.Request(direct_url, headers=headers)
                  with urllib.request.urlopen(sub_req) as sub_resp, open("input.apk", "wb") as out_f:
                      size = sub_resp.headers.get("Content-Length", "Unknown")
                      print(f"Streaming APK file (Size: {size} bytes)...")
                      while True:
                          chunk = sub_resp.read(2 * 1024 * 1024)
                          if not chunk:
                              break
                          out_f.write(chunk)
                          print(".", end="", flush=True)
                      print("\nDownload complete!")

          if os.path.exists("input.apk") and os.path.getsize("input.apk") > 1000000:
              print(f"✅ Download Verified. File Size: {os.path.getsize('input.apk') / (1024*1024):.2f} MB")
          else:
              print("❌ Downloaded file is too small or invalid APK.")
              sys.exit(1)
          EOF

      - name: Clone & Download Official Morphe Tools
        run: |
          mkdir -p build-tools
          cd build-tools

          echo "Fetching latest Morphe / ReVanced CLI..."
          CLI_URL=$(curl -s https://api.github.com/repos/ReVanced/revanced-cli/releases/latest | grep -o 'https://[^"]*revanced-cli-[0-9.]*-all.jar' | head -n 1)
          curl -sL "$CLI_URL" -o cli.jar

          echo "Fetching latest Morphe Patches & Integrations..."
          PATCHES_URL=$(curl -s https://api.github.com/repos/MorpheApp/morphe-patches/releases/latest | grep -o 'https://[^"]*morphe-patches-[0-9.]*.jar' | head -n 1 || curl -s https://api.github.com/repos/ReVanced/revanced-patches/releases/latest | grep -o 'https://[^"]*revanced-patches-[0-9.]*.jar' | head -n 1)
          INTEGRATIONS_URL=$(curl -s https://api.github.com/repos/MorpheApp/morphe-patches/releases/latest | grep -o 'https://[^"]*morphe-integrations-[0-9.]*.apk' | head -n 1 || curl -s https://api.github.com/repos/ReVanced/revanced-integrations/releases/latest | grep -o 'https://[^"]*revanced-integrations-[0-9.]*.apk' | head -n 1)

          curl -sL "$PATCHES_URL" -o patches.jar
          curl -sL "$INTEGRATIONS_URL" -o integrations.apk

          echo "Tools Ready:"
          ls -lh

      - name: Patch APK with Morphe Engine
        run: |
          echo "Starting patch process for ${{ github.event.inputs.app_type }}..."
          
          java -jar build-tools/cli.jar patch \
            --patches build-tools/patches.jar \
            --merge build-tools/integrations.apk \
            --out "Morphe-${{ github.event.inputs.app_type }}.apk" \
            input.apk

      - name: Sign APK (Zipalign & Apksigner)
        run: |
          echo "Signing Patched APK..."
          keytool -genkey -v -keystore release.keystore -alias morphe -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android -dname "CN=Morphe, OU=Morphe, O=Morphe, L=Unknown, ST=Unknown, C=US"

          zipalign -v -p 4 "Morphe-${{ github.event.inputs.app_type }}.apk" "Morphe-${{ github.event.inputs.app_type }}-aligned.apk" || mv "Morphe-${{ github.event.inputs.app_type }}.apk" "Morphe-${{ github.event.inputs.app_type }}-aligned.apk"
          
          apksigner sign --ks release.keystore --ks-pass pass:android --key-pass pass:android \
            --out "Morphe-${{ github.event.inputs.app_type }}-signed.apk" "Morphe-${{ github.event.inputs.app_type }}-aligned.apk"

          echo "Final signed APK ready:"
          ls -lh Morphe-*-signed.apk

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Morphe-${{ github.event.inputs.app_type }}
          path: Morphe-${{ github.event.inputs.app_type }}-signed.apk
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: ${{ github.event.inputs.app_type }}-v${{ github.run_number }}
          name: "Morphe ${{ github.event.inputs.app_type }} (Build #${{ github.run_number }})"
          body: |
            ### 💊 Morphe ${{ github.event.inputs.app_type }} Built Successfully!
            - **Target:** ${{ github.event.inputs.app_type }}
            - **Built on:** ${{ github.event.repository.updated_at }}
            - **GmsCore / MicroG:** Supported
          files: Morphe-${{ github.event.inputs.app_type }}-signed.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
